<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Image Viewer</title>
    <style>
        /* 1. Basic Page Setup */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            background-color: #000; /* Black background looks best for photos */
            overflow: hidden; /* Prevents scrolling */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 2. Image Styling */
        #display-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain; /* Ensures the image fits without stretching */
            
            /* 3. iOS & Mobile Prevention (Stops 'Save Image' menu appearing) */
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -khtml-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-user-drag: none;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <img id="display-image" src="cover.png" alt="Interactive Image">

    <script>
        const img = document.getElementById('display-image');
        const coverSrc = 'cover.png';
        const underSrc = 'under.png';

        // 1. Preload the second image so there is no lag when clicking
        const preloadImg = new Image();
        preloadImg.src = underSrc;

        // Functions to switch images
        function showUnder() {
            img.src = underSrc;
        }

        function showCover() {
            img.src = coverSrc;
        }

        // 2. MOUSE EVENTS (Desktop)
        img.addEventListener('mousedown', showUnder);
        img.addEventListener('mouseup', showCover);
        img.addEventListener('mouseleave', showCover); // Revert if mouse drags off image

        // 3. TOUCH EVENTS (Mobile/Tablet)
        img.addEventListener('touchstart', function(e) {
            e.preventDefault(); // Critical: stops the default iOS magnifying glass/menu
            showUnder();
        }, { passive: false });

        img.addEventListener('touchend', showCover);
        img.addEventListener('touchcancel', showCover);

        // 4. Disable Right Click Menu (Clean experience)
        document.addEventListener('contextmenu', event => event.preventDefault());
    </script>

</body>
</html>
