<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>YunaData has moved</title>

  <link rel="canonical" href="https://yunadata.pages.dev/">
  <meta http-equiv="refresh"
        content="0; url=https://yunadata.pages.dev/">

  <script>
    const destination = new URL(
      document.querySelector('link[rel="canonical"]').href
    );

    destination.search = window.location.search;
    destination.hash = window.location.hash;

    window.location.replace(destination.href);
  </script>
</head>
<body>
  <p>
    YunaData has moved.
    <a href="https://yunadata.pages.dev/">Visit the new website</a>.
  </p>
</body>
</html>
